# Development tools only. Native wheels are built by scripts/go_distribution.py.
[project]
name = "avr-cli-dev"
version = "0.0.0"
description = "Development and packaging tools for the native Avrea CLI"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-timeout>=2.4.0",
  "ruff==0.17.3",  # ALL rules change with new Ruff releases; upgrade deliberately.
  "ty==0.0.15",  # pre-release; pin until 0.1.x stabilizes
]

[tool.pytest.ini_options]
timeout = 60
testpaths = ["scripts"]

[tool.uv]
required-version = ">=0.11.11"
package = false
exclude-newer = "P3D"

[tool.ty.environment]
python-version = "3.14"
