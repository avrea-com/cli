# Config for oss-report (an internal Avrea tool). Regenerate the SBOMs under
# .oss-report/ per release with `make sbom`.
#
# `version` must track pyproject.toml: it becomes the SBOM's root version, and
# the release workflow and pre-push hook both fail if the committed SBOM version
# does not match the tag, so a forgotten regeneration is caught before shipping.
project:
  name: Avrea CLI
  version: "0.3.0"
  contact: security@avrea.com
