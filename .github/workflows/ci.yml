name: CI

on:
  workflow_call:        # invoked by release.yml as a gate before publishing
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal default permissions; individual jobs can elevate if they need to.
permissions:
  contents: read

# Cancel superseded PR runs (push-to-main runs aren't cancelled, see cancel-in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      - run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      # Invoke uv directly instead of `make test` — Windows runners don't have
      # make. Keep this command in sync with the `test` target in the Makefile.
      - run: uv run --extra dev python -m pytest tests -v

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      - run: make docs-check

  # Software-composition analysis: fail the build (and therefore any release,
  # since release.yml runs this workflow as a gate) on a known vulnerability of
  # medium severity or worse.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      # Export the hash-pinned production dependency set from uv.lock into a
      # dedicated directory holding only requirements.txt. Scanning that dir
      # (rather than the repo root) keeps grype from re-cataloguing uv.lock /
      # pyproject.toml — which carry the dev set — so the --no-dev scoping
      # actually holds and a dev-only CVE can't block a release. The non-empty
      # guard makes the gate fail loudly instead of passing on an empty export.
      - name: Export pinned production dependencies
        run: |
          mkdir -p sca-scope
          uv export --frozen --no-emit-project --no-dev --format requirements-txt --output-file sca-scope/requirements.txt
      - name: Fail if no dependencies were resolved
        run: test "$(grep -c '==' sca-scope/requirements.txt)" -gt 0
      # Primary gate: scan only the exported production set, so a newly disclosed
      # CVE blocks the build even when the committed SBOM hasn't been regenerated.
      - name: Scan dependency tree
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "sca-scope"
          severity-cutoff: medium
          fail-build: true
          output-format: table
      # Independently verify the published SBOM artefact (production scope) is
      # itself free of known vulnerabilities — this is the file we attach to the
      # release and retain for our records.
      - name: Scan published SBOM (.oss-report)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ".oss-report/bom.cyclonedx.json"
          severity-cutoff: medium
          fail-build: true
          output-format: table

  go-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The parity runner extracts its pinned Python baseline.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
      - run: uv run --python 3.14 --frozen --extra dev python scripts/generate_go_api.py --check
      - run: go test -race ./...
      - run: go build -trimpath -o build/go/avr.exe ./cmd/avr
      - run: uv run --python 3.14 --frozen --extra dev python scripts/go_notices.py
      - run: uv run --python 3.14 --frozen --extra dev python scripts/setup_parity_jq.py
      - run: uv run --python 3.14 --frozen --extra dev python scripts/compare_auth.py --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_inspection --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_jobs --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_run_control --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_workflow --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_workflow_run --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_job_watch --go build/go/avr.exe
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_job_metrics --go build/go/avr.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-preview-${{ matrix.os }}
          path: |
            build/go/avr.exe
            build/go/auth-parity.json
            build/go/inspection-parity.json
            build/go/job-parity.json
            build/go/run-control-parity.json
            build/go/workflow-parity.json
            build/go/workflow-run-parity.json
            build/go/job-watch-parity.json
            build/go/job-metrics-parity.json
            build/go/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make go-lint go-scan
      - name: Check formatting and dependency drift
        shell: bash
        run: |
          test -z "$(gofmt -l cmd commands config client output)"
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum
