name: CI

on:
  workflow_call:        # invoked by release.yml as a gate before publishing
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal default permissions; individual jobs can elevate if they need to.
permissions:
  contents: read

# Cancel superseded PR runs (push-to-main runs aren't cancelled, see cancel-in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      - run: make tooling-lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      # Invoke uv directly instead of `make test` — Windows runners don't have
      # make. Native unit/integration tests run in go-preview.yml.
      - run: uv run --frozen --extra dev python -m pytest scripts/test_go_package.py scripts/test_go_distribution.py scripts/test_go_publish.py scripts/test_go_release.py scripts/test_go_schema_fetch.py -q

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: make docs-check

  # Software-composition analysis: fail the build (and therefore any release,
  # since release.yml runs this workflow as a gate) on a known vulnerability of
  # medium severity or worse.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
      # Python is tooling-only. Native dependencies are scanned by go-scan
      # and the artifact SBOM gate in go-package.yml.
      - name: Export pinned tooling dependencies
        run: |
          mkdir -p sca-scope
          uv export --frozen --extra dev --no-emit-project --format requirements-txt --output-file sca-scope/requirements.txt
      - name: Fail if no dependencies were resolved
        run: test "$(grep -c '==' sca-scope/requirements.txt)" -gt 0
      - name: Scan tooling dependency tree
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "sca-scope"
          severity-cutoff: medium
          fail-build: true
          output-format: table
