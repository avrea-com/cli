name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases must serialize — never run two publishes concurrently and never
# cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run the full CI suite (lint, test on all OS, docs-check) against the
  # tagged commit so the published artifact is guaranteed to come from a
  # green build.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust_target: aarch64-apple-darwin, target: darwin_arm64 }
          - { os: ubuntu-22.04, rust_target: x86_64-unknown-linux-gnu, target: linux_amd64 }
          - { os: windows-latest, rust_target: x86_64-pc-windows-msvc, target: windows_amd64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # PyApp is the Rust bootstrapper that wraps our PyPI wheel into a
      # standalone binary. Pin the version and its source checksum together and
      # bump both deliberately, like any build tool.
      PYAPP_VERSION: "0.29.0"
      # sha256 of the pinned source.tar.gz. The versioned release asset is
      # mutable, so the Fetch step verifies this before anything is compiled.
      PYAPP_SHA256: "0533004baf6d1d46ef15abad02e98881ec92291c024182a36b57931c8d66df5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Inject _build_info
        shell: bash
        run: |
          cat > avrea_cli/_build_info.py <<EOF
          # Auto-generated by .github/workflows/release.yml; do not edit.
          GIT_COMMIT = "${{ github.sha }}"
          EOF

      - name: Build wheel
        run: uv build --wheel

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Fetch PyApp source
        shell: bash
        run: |
          curl -fsSL "https://github.com/ofek/pyapp/releases/download/v${PYAPP_VERSION}/source.tar.gz" -o pyapp-source.tar.gz
          # Verify the mutable release asset before extraction: sha256sum on
          # Linux/Windows runners, shasum on macOS (which has no sha256sum).
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${PYAPP_SHA256}  pyapp-source.tar.gz" | sha256sum -c -
          else
            echo "${PYAPP_SHA256}  pyapp-source.tar.gz" | shasum -a 256 -c -
          fi
          tar -xzf pyapp-source.tar.gz
          mv "pyapp-v${PYAPP_VERSION}" pyapp

      - name: Build standalone binary
        working-directory: pyapp
        env:
          PYAPP_PROJECT_NAME: avr-cli
          PYAPP_PROJECT_VERSION: ${{ steps.version.outputs.value }}
          PYAPP_PROJECT_PATH: ${{ github.workspace }}/dist/avr_cli-${{ steps.version.outputs.value }}-py3-none-any.whl
          PYAPP_EXEC_SPEC: avrea_cli.main:main
          PYAPP_PYTHON_VERSION: "3.14"
          PYAPP_DISTRIBUTION_EMBED: "1"
          PYAPP_FULL_ISOLATION: "1"
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Stage binary, smoke test, and pre-generate completions
        shell: bash
        # `--version` skips Click's command resolution, so a real subcommand is
        # also invoked to force the lazy imports under avrea_cli.commands.*.
        # Completions are pre-generated here, not in the formula: the binary
        # pip-installs its deps on first run, and Homebrew's install sandbox
        # denies network, so generating them at `brew install` time would fail.
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p out
          cp "pyapp/target/${{ matrix.rust_target }}/release/pyapp${ext}" "out/avr${ext}"
          "out/avr${ext}" --version
          "out/avr${ext}" auth --help >/dev/null
          # Click emits only bash/zsh/fish completions; there is no consumer on
          # Windows, so the Windows artifact is just the .exe.
          if [ "${{ runner.os }}" != "Windows" ]; then
            mkdir -p out/completions
            _AVR_COMPLETE=zsh_source  out/avr > out/completions/avr.zsh
            _AVR_COMPLETE=bash_source out/avr > out/completions/avr.bash
            _AVR_COMPLETE=fish_source out/avr > out/completions/avr.fish
          fi

      - name: Package archive
        shell: bash
        # Windows ships a .zip; bsdtar builds it from the .zip extension.
        # macOS/Linux ship a .tar.gz with the completions dir.
        run: |
          version="${{ steps.version.outputs.value }}"
          target="${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            tar -a -cf "avr_${version}_${target}.zip" -C out avr.exe
          else
            tar -czf "avr_${version}_${target}.tar.gz" -C out .
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            avr_*.tar.gz
            avr_*.zip
          if-no-files-found: error

  publish:
    needs: [ci, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avr-cli
    permissions:
      id-token: write       # PyPI Trusted Publisher (OIDC) + Sigstore signing
      contents: write       # create the GitHub Release
      attestations: write   # record SLSA build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Verify tag matches pyproject version
        # Skipped on workflow_dispatch (no tag to verify).
        if: github.event_name == 'push'
        run: |
          pyproject_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pyproject_version" >&2
            exit 1
          fi

      - name: Verify committed SBOM matches the release
        # The SBOM under .oss-report/ is regenerated per release with `make sbom`
        # (its version comes from oss-report.yaml). Fail the release if it still
        # carries a previous version. The pre-push hook runs the same check
        # locally.
        if: github.event_name == 'push'
        run: |
          sbom_version=$(jq -r '.metadata.component.version' .oss-report/bom.cyclonedx.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$sbom_version" != "$tag_version" ]; then
            echo "::error::SBOM version $sbom_version does not match release $tag_version; run 'make sbom' and commit" >&2
            exit 1
          fi

      - name: Inject _build_info
        # Embed the release commit so `avr --version` can report it without
        # shelling out to git at runtime. version.py reads this lazily.
        run: |
          cat > avrea_cli/_build_info.py <<EOF
          # Auto-generated by .github/workflows/release.yml; do not edit.
          GIT_COMMIT = "${{ github.sha }}"
          EOF

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries/
          merge-multiple: true

      - name: Attest build provenance
        # Keyless SLSA provenance (Sigstore). Covers the GitHub Release binary
        # tarballs and the wheel/sdist so users can verify authenticity with
        # `gh attestation verify <file> --repo ${{ github.repository }}`.
        # PyPI artifacts also carry PEP 740 attestations from the OIDC publish.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*
            binaries/*
            .oss-report/bom.cyclonedx.json
            .oss-report/bom.spdx.json

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* binaries/* \
            .oss-report/bom.cyclonedx.json .oss-report/bom.spdx.json
