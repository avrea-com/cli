name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and validate artifacts; they never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate release trigger and publication gate
        id: plan
        env:
          RELEASE_ENABLED: ${{ vars.AVR_NATIVE_RELEASE_ENABLED }}
        run: python -m scripts.go_release

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  go:
    needs: version
    uses: ./.github/workflows/go-preview.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.AVR_NATIVE_RELEASE_ENABLED == 'true' && needs.version.outputs.publish == 'true'
    needs: [version, ci, go]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avr-cli
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avr-release-candidate
          path: release
      - name: Verify and stage the tested wheels
        run: |
          cd release
          sha256sum --strict -c SHA256SUMS
          test "$(cat avr-version.txt)" = "${GITHUB_REF_NAME#v}"
          mkdir ../dist
          cp ./*.whl ../dist/
      - name: Attest the tested release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Prepare resumable GitHub draft and verify existing PyPI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.go_publish prepare --tag "$GITHUB_REF_NAME"
      - name: Publish native wheels to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
      - name: Publish prepared GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.go_publish finalize --tag "$GITHUB_REF_NAME"
