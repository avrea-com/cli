name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases must serialize — never run two publishes concurrently and never
# cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run the full CI suite (lint, test on all OS, docs-check) against the
  # tagged commit so the published artifact is guaranteed to come from a
  # green build.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin_arm64 }
          - { os: ubuntu-22.04, target: linux_amd64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Inject _build_info
        run: |
          cat > avrea_cli/_build_info.py <<EOF
          # Auto-generated by .github/workflows/release.yml; do not edit.
          GIT_COMMIT = "${{ github.sha }}"
          EOF

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build standalone binary
        run: |
          uv run pyinstaller --onefile --name avr \
            --collect-all click \
            --collect-all pydantic \
            --collect-all certifi \
            pyinstaller_entry.py

      - name: Smoke test the binary
        run: ./dist/avr --version

      - name: Package tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          tar -czf "avr_${version}_${{ matrix.target }}.tar.gz" -C dist avr

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: avr_*.tar.gz
          if-no-files-found: error

  publish:
    needs: [ci, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avr-cli
    permissions:
      id-token: write    # PyPI Trusted Publisher (OIDC); no API token needed
      contents: write    # create the GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Verify tag matches pyproject version
        # Skipped on workflow_dispatch (no tag to verify).
        if: github.event_name == 'push'
        run: |
          pyproject_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pyproject_version" >&2
            exit 1
          fi

      - name: Inject _build_info
        # Embed the release commit so `avr --version` can report it without
        # shelling out to git at runtime. version.py reads this lazily.
        run: |
          cat > avrea_cli/_build_info.py <<EOF
          # Auto-generated by .github/workflows/release.yml; do not edit.
          GIT_COMMIT = "${{ github.sha }}"
          EOF

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries/
          merge-multiple: true

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* binaries/*
