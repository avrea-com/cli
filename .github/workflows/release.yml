name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases must serialize — never run two publishes concurrently and never
# cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run the full CI suite (lint, test on all OS, docs-check) against the
  # tagged commit so the published artifact is guaranteed to come from a
  # green build.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avr-cli
    permissions:
      id-token: write    # PyPI Trusted Publisher (OIDC); no API token needed
      contents: write    # create the GitHub Release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version-file: pyproject.toml

      - name: Verify tag matches pyproject version
        # Skipped on workflow_dispatch (no tag to verify).
        if: github.event_name == 'push'
        run: |
          pyproject_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pyproject_version" >&2
            exit 1
          fi

      - name: Inject _build_info
        # Embed the release commit so `avr --version` can report it without
        # shelling out to git at runtime. version.py reads this lazily.
        run: |
          cat > avrea_cli/_build_info.py <<EOF
          # Auto-generated by .github/workflows/release.yml; do not edit.
          GIT_COMMIT = "${{ github.sha }}"
          EOF

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
