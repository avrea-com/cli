name: Go preview packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin_arm64
          - os: ubuntu-22.04
            target: linux_amd64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Test package integrity checks
        run: python -m unittest scripts.test_go_package -v
      - name: Build archive and validate extracted executable
        run: python scripts/go_package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avr-go-package-${{ matrix.target }}
          path: build/go/packages/*
          if-no-files-found: error

  validate-download:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin_arm64
          - os: ubuntu-22.04
            target: linux_amd64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avr-go-package-${{ matrix.target }}
          path: build/go/downloaded
      - name: Validate downloaded archive on a fresh native runner
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: >-
          python -c "from pathlib import Path; import os; from scripts.go_package import verify;
          archives=[p for p in Path('build/go/downloaded').iterdir() if p.name.endswith(('.tar.gz', '.zip'))];
          assert len(archives)==1, archives;
          report=verify(archives[0]);
          assert report['manifest']['target']==os.environ['EXPECTED_TARGET'], report['manifest'];
          assert report['manifest']['commit']==os.environ['GITHUB_SHA'], report['manifest'];
          assert report['manifest']['dirty'] is False, report['manifest']"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avr-go-download-validation-${{ matrix.target }}
          path: build/go/downloaded/*.validation.json
          if-no-files-found: error
