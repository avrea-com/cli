name: Go preview packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin_arm64
          - os: ubuntu-22.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Test package integrity checks
        run: python -m unittest scripts.test_go_package scripts.test_go_distribution -v
      - name: Test stock Windows PowerShell installer
        if: runner.os == 'Windows'
        env:
          AVR_TEST_POWERSHELL: powershell.exe
        run: python -m unittest scripts.test_go_distribution -v
      - name: Build archive and validate extracted executable
        run: python scripts/go_package.py --target ${{ matrix.target }}
      - name: Build native PyPI wheel from validated archive
        shell: bash
        run: |
          python -c "from pathlib import Path; from scripts.go_distribution import build; archives=[p for p in Path('build/go/packages').iterdir() if p.name.endswith(('.tar.gz', '.zip'))]; assert len(archives)==1; build(archives[0], Path('build/go/packages'))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avr-go-package-${{ matrix.target }}
          path: build/go/packages/*
          if-no-files-found: error

  validate-download:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin_arm64
          - os: ubuntu-22.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avr-go-package-${{ matrix.target }}
          path: build/go/downloaded
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Install pipx validation tool
        run: python -m pip install pipx==1.18.11
      - name: Validate downloaded archive on a fresh native runner
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: >-
          python -c "from pathlib import Path; import os; from scripts.go_package import verify;
          archives=[p for p in Path('build/go/downloaded').iterdir() if p.name.endswith(('.tar.gz', '.zip'))];
          assert len(archives)==1, archives;
          report=verify(archives[0]);
          assert report['manifest']['target']==os.environ['EXPECTED_TARGET'], report['manifest'];
          assert report['manifest']['commit']==os.environ['GITHUB_SHA'], report['manifest'];
          assert report['manifest']['dirty'] is False, report['manifest']"
      - name: Validate installers and Python package-manager upgrade paths
        run: python -m scripts.validate_go_install --directory build/go/downloaded
      - name: Validate the Linux binary and installer on Alpine
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman
          podman run --rm -v "$PWD:/src:ro" -w /src docker.io/library/alpine:3.24 \
            sh scripts/validate_go_alpine.sh build/go/downloaded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avr-go-download-validation-${{ matrix.target }}
          path: build/go/downloaded/*.validation.json
          if-no-files-found: error

  channels:
    env:
      SYFT_SOURCE_NAME: avr-cli
    needs: validate-download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: avr-go-package-*
          path: build/go/distribution
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: avr-go-download-validation-*
          path: build/go/distribution
          merge-multiple: true
      - name: Prepare verified release channel files
        run: |
          python -m scripts.go_distribution --channels --commit "$GITHUB_SHA" --sbom-source build/go/sbom-source
          echo "SYFT_SOURCE_VERSION=$(cat internal/version/VERSION)" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: build/go/sbom-source
          format: cyclonedx-json
          output-file: build/go/bom.cyclonedx.json
          syft-version: v1.56.0
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: build/go/sbom-source
          format: spdx-json
          output-file: build/go/bom.spdx.json
          syft-version: v1.56.0
          upload-artifact: false
          upload-release-assets: false
      - name: Scan native distribution SBOM
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: build/go/bom.cyclonedx.json
          severity-cutoff: medium
          fail-build: true
          output-format: table
      - name: Include release SBOMs
        run: |
          python -m scripts.go_distribution --check-sbom build/go/bom.cyclonedx.json
          cp build/go/bom.*.json build/go/distribution/
          python -m scripts.go_distribution --channels --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avr-release-candidate
          path: build/go/distribution/*
          if-no-files-found: error
