name: Go preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

jobs:
  go-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The parity runner extracts its pinned Python baseline.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
      - name: Install completion test shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fish zsh
      - run: uv run --python 3.14 --frozen --extra dev python scripts/generate_go_api.py --check
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.generate_go_doc_metadata --check
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.audit_go_commands --go-tool go
        if: matrix.shard == 0
      - run: go test -race ./...
        if: matrix.shard == 0
      - run: go build -trimpath -o build/go/avr.exe ./cmd/avr
      # Report trends without flaky wall-clock thresholds on shared runners.
      - name: Measure fresh-process startup
        if: matrix.shard == 0
        run: python scripts/benchmark_startup.py --binary build/go/avr.exe --samples 101 --report build/go/startup/current.json
      - name: Measure command setup allocations
        if: matrix.shard == 0
        shell: bash
        run: go test ./commands -run '^$' -bench '^BenchmarkStartup$' -benchmem > build/go/startup/benchmarks.txt
      - run: uv run --python 3.14 --frozen --extra dev python scripts/go_notices.py
      - run: uv run --python 3.14 --frozen --extra dev python scripts/setup_parity_jq.py
      - run: uv run --python 3.14 --frozen --extra dev python scripts/compare_auth.py --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_inspection --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_jobs --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_run_control --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_workflow --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_workflow_run --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_job_watch --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_job_metrics --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_run_diagnose --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_pr --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_status --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_artifact --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_cache --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_log_search --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_tests --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_sbom --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_sbom_download --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_sbom_generate --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_config --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_token --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_token_create --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_settings --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_organization --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_saml --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_installations --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_native_ci --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_gitlab --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_public_mirrors --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_git_mirrors --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_clone --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_audit_health --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_billing --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_billing_writes --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_invoice_download --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_firewall --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_inspection --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_lifecycle --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_update --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_create --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_ssh_config --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_ssh --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_tunnel --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_vm_bootstrap --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_aliases --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_internal_docs --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_help --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_completion --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_option_gaps --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_option_values --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_option_aliases --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_global --go build/go/avr.exe
        if: matrix.shard == 1
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_usage_errors --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_argument_contract --go build/go/avr.exe
        if: matrix.shard == 2
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_defaults --go build/go/avr.exe
        if: matrix.shard == 3
      - run: uv run --python 3.14 --frozen --extra dev python -m scripts.compare_billing_card --go build/go/avr.exe
        if: matrix.shard == 0
      - run: uv run --python 3.14 --frozen --extra dev python -m pytest scripts/test_go_clone.py scripts/test_go_billing_card.py scripts/test_go_vm_ssh.py scripts/test_go_vm_tunnels.py scripts/test_go_vm_bootstrap.py scripts/test_go_docs.py scripts/test_go_completion.py -q
        if: matrix.shard == 0
        env:
          AVR_GO_BINARY: build/go/avr.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-preview-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            build/go/avr.exe
            build/go/*parity*.json
            build/go/command-surface-audit.json
            build/go/THIRD-PARTY-NOTICES.txt
            build/go/startup/
          if-no-files-found: error

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make go-lint go-scan
      - name: Check formatting and dependency drift
        shell: bash
        run: |
          test -z "$(gofmt -l cmd commands config client output)"
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum

  # Build/test downloadable previews independently; full parity still runs above.
  go-packages:
    uses: ./.github/workflows/go-package.yml
