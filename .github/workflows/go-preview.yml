name: Go preview

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

jobs:
  go-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - name: Install completion test shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fish zsh
      - run: go test -race ./...
      - run: go build -trimpath -o build/go/avr.exe ./cmd/avr
        env:
          CGO_ENABLED: "0"
      # Report trends without flaky wall-clock thresholds on shared runners.
      - name: Measure fresh-process startup
        run: python scripts/benchmark_startup.py --binary build/go/avr.exe --samples 101 --report build/go/startup/current.json
      - name: Measure command setup allocations
        shell: bash
        run: go test ./commands -run '^$' -bench '^BenchmarkStartup$' -benchmem > build/go/startup/benchmarks.txt
      - run: uv run --python 3.14 --frozen --extra dev python scripts/go_notices.py
      - run: uv run --python 3.14 --frozen --extra dev python -m pytest scripts/test_go_clone.py scripts/test_go_billing_card.py scripts/test_go_vm_ssh.py scripts/test_go_vm_tunnels.py scripts/test_go_vm_bootstrap.py scripts/test_go_docs.py scripts/test_go_completion.py -q
        env:
          AVR_GO_BINARY: build/go/avr.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-preview-${{ matrix.os }}
          path: |
            build/go/avr.exe
            build/go/THIRD-PARTY-NOTICES.txt
            build/go/startup/
          if-no-files-found: error

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make go-lint go-scan
      - name: Check formatting and dependency drift
        shell: bash
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum

  # Build/test downloadable previews independently; native regression tests run above.
  go-packages:
    uses: ./.github/workflows/go-package.yml
